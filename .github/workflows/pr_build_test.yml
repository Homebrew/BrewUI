name: Build and Test

on:
  push:
    branches:
      - main
    paths:
      - "Brew/**"
      - "BrewTests/**"
      - "BrewUITests/**"
      - "Homebrew.xcodeproj/**"
      - "Brew.entitlements"
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "Tools/BrewUILint/**"
      - "scripts/test"
      - "scripts/test-ui"
      - "Brewfile"
      - "Mintfile"
      - ".periphery.yml"
      - ".periphery-baseline.json"
      - ".github/workflows/pr_build_test.yml"
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "Brew/**"
      - "BrewTests/**"
      - "BrewUITests/**"
      - "Homebrew.xcodeproj/**"
      - "Brew.entitlements"
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "Tools/BrewUILint/**"
      - "scripts/test"
      - "scripts/test-ui"
      - "Mintfile"
      - ".periphery.yml"
      - ".periphery-baseline.json"
      - ".github/workflows/pr_build_test.yml"
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Optional xcodebuild -only-testing filter for the UI suite"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # A dispatched run has no pull request to key on; fall back to the ref so manual
  # runs on the same branch still supersede each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + unit/integration tests
    runs-on: macos-26
    timeout-minutes: 25
    env:
      MINT_PATH: ${{ github.workspace }}/mint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job uploads artifacts on failure; a persisted token in .git/config could ride along.
          persist-credentials: false

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project Homebrew.xcodeproj

      - name: Build and test (Xcode app target)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Homebrew.xcodeproj \
            -scheme Brew-Unit \
            -derivedDataPath DerivedData \
            -destination "platform=macOS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Capture Swift toolchain fingerprint
        id: swift-toolchain
        run: echo "fingerprint=$(swift --version | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache BrewKit .build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-brewkit-${{ steps.swift-toolchain.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-brewkit-${{ steps.swift-toolchain.outputs.fingerprint }}-

      - name: Run BrewKit package tests
        run: |
          set -o pipefail
          xcrun swift test --package-path . | tee swift-test-brewkit.log

      - name: Cache BrewUILint .build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Tools/BrewUILint/.build
          key: ${{ runner.os }}-brewuilint-${{ steps.swift-toolchain.outputs.fingerprint }}-${{ hashFiles('Tools/BrewUILint/Package.swift', 'Tools/BrewUILint/Package.resolved', 'Tools/BrewUILint/Sources/**', 'Tools/BrewUILint/Tests/**', 'Tools/BrewUILint/Plugins/**') }}
          restore-keys: |
            ${{ runner.os }}-brewuilint-${{ steps.swift-toolchain.outputs.fingerprint }}-

      - name: Run BrewUILint package tests
        run: |
          set -o pipefail
          xcrun swift test --package-path Tools/BrewUILint | tee swift-test-brewuilint.log

      - name: Cache Homebrew prefix
        uses: Homebrew/actions/cache-homebrew-prefix@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2
        with:
          brewfile: true
          uninstall: true
          workflow-key: pr-build-test

      - name: Cache Mint packages
        id: mint-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/mint
          key: ${{ runner.os }}-mint-${{ hashFiles('**/Mintfile') }}
          restore-keys: |
            ${{ runner.os }}-mint-

      - name: Install Mintfile packages
        if: steps.mint-cache.outputs.cache-hit != 'true'
        run: mint bootstrap --mintfile Mintfile
      - name: Periphery dead-code scan
        run: |
          set -o pipefail
          # Reuse the index store produced by the xcodebuild test step (no second build).
          index="DerivedData/Index.noindex/DataStore"
          if [ ! -d "$index" ]; then
            index="$(find DerivedData -type d -name DataStore -path '*Index*' | head -n 1)"
          fi
          echo "Using index store: $index"
          if [ -f .periphery-baseline.json ]; then
            mint run periphery scan \
              --index-store-path "$index" --skip-build \
              --baseline .periphery-baseline.json --strict \
              --relative-results --format github-actions
          else
            echo "::warning::No .periphery-baseline.json committed yet — writing a seed baseline (this run does NOT gate). Download the 'periphery-baseline' artifact from this run, commit it as .periphery-baseline.json, and subsequent PRs will fail only on newly introduced dead code."
            mint run periphery scan \
              --index-store-path "$index" --skip-build \
              --write-baseline .periphery-baseline.json \
              --relative-results
          fi

      - name: Upload periphery seed baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: periphery-baseline
          path: .periphery-baseline.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-build-test-logs
          path: |
            xcodebuild.log
            swift-test-brewkit.log
            swift-test-brewuilint.log
          retention-days: 7

  ui-test:
    name: UI tests
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job uploads artifacts on failure; a persisted token in .git/config could ride along.
          persist-credentials: false

      - name: Build and run UI tests (Brew-UI scheme)
        # Through env rather than interpolated into the script body, so the input cannot inject shell.
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          set -o pipefail
          if [[ -n "${TEST_FILTER}" ]]; then
            scripts/test-ui -only-testing:"${TEST_FILTER}" | tee xcodebuild-ui.log
          else
            scripts/test-ui | tee xcodebuild-ui.log
          fi

      - name: Upload logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-logs
          path: |
            xcodebuild-ui.log
            UITestResults.xcresult
          retention-days: 7

name: Swift Quality

on:
  push:
    branches:
      - main
    paths:
      - "**/*.swift"
      - ".swiftlint*"
      - ".swiftformat"
      - "Brewfile"
      - "Mintfile"
      - "scripts/bootstrap"
      - "scripts/pre-commit"
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "**/*.swift"
      - ".swiftlint*"
      - ".swiftformat"
      - "Brewfile"
      - "Mintfile"
      - "scripts/bootstrap"
      - "scripts/pre-commit"

permissions:
  contents: read

jobs:
  swift-quality:
    name: SwiftFormat + SwiftLint
    runs-on: macos-26
    env:
      MINT_PATH: ${{ github.workspace }}/mint
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache Homebrew prefix
        uses: Homebrew/actions/cache-homebrew-prefix@main
        with:
          brewfile: true
          uninstall: true
          workflow-key: swift-quality

      - name: Cache Mint packages
        id: mint-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/mint
          key: ${{ runner.os }}-mint-${{ hashFiles('**/Mintfile') }}
          restore-keys: |
            ${{ runner.os }}-mint-

      - name: Install Mintfile packages
        if: steps.mint-cache.outputs.cache-hit != 'true'
        run: mint bootstrap --mintfile Mintfile

      - name: Check formatting
        run: mint run swiftformat --lint .

      - name: Run SwiftLint (strict)
        run: mint run swiftlint lint --strict

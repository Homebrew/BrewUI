name: Swift Quality

on:
  push:
    branches:
      - main
    paths:
      - "**/*.swift"
      - "**/*.xcstrings"
      - "Package.swift"
      - "Package.resolved"
      - ".swiftlint*"
      - ".swiftformat"
      - "Brewfile"
      - "Mintfile"
      - "Tools/BrewUILint/**"
      - "Tools/BrewLocalize/**"
      - "scripts/bootstrap"
      - "scripts/pre-commit"
      - "scripts/localize"
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "**/*.swift"
      - "**/*.xcstrings"
      - "Package.swift"
      - "Package.resolved"
      - ".swiftlint*"
      - ".swiftformat"
      - "Brewfile"
      - "Mintfile"
      - "Tools/BrewUILint/**"
      - "Tools/BrewLocalize/**"
      - "scripts/bootstrap"
      - "scripts/pre-commit"
      - "scripts/localize"

permissions:
  contents: read

jobs:
  swift-quality:
    name: SwiftFormat + SwiftLint + BrewUILint
    runs-on: macos-26
    env:
      MINT_PATH: ${{ github.workspace }}/mint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Homebrew prefix
        uses: Homebrew/actions/cache-homebrew-prefix@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          brewfile: true
          uninstall: true
          workflow-key: swift-quality

      - name: Cache Mint packages
        id: mint-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/mint
          key: ${{ runner.os }}-mint-${{ hashFiles('**/Mintfile') }}
          restore-keys: |
            ${{ runner.os }}-mint-

      - name: Install Mintfile packages
        if: steps.mint-cache.outputs.cache-hit != 'true'
        run: mint bootstrap --mintfile Mintfile

      - name: Check formatting
        run: mint run swiftformat --lint .

      - name: Run SwiftLint (strict)
        run: mint run swiftlint lint --strict

      - name: Capture Swift toolchain fingerprint
        id: swift-toolchain
        run: echo "fingerprint=$(swift --version | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache BrewUILint build
        id: brewuilint-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Tools/BrewUILint/.build
          key: ${{ runner.os }}-brewuilint-${{ steps.swift-toolchain.outputs.fingerprint }}-${{ hashFiles('Tools/BrewUILint/Package.swift', 'Tools/BrewUILint/Package.resolved', 'Tools/BrewUILint/Sources/**', 'Tools/BrewUILint/Plugins/**') }}

      - name: Build BrewUILint
        if: steps.brewuilint-cache.outputs.cache-hit != 'true'
        run: swift build --package-path Tools/BrewUILint -c release --enable-experimental-prebuilts

      - name: Run BrewUILint
        run: |
          BREWUILINT="$(swift build --package-path Tools/BrewUILint -c release --show-bin-path)/BrewUILint"
          find Homebrew Sources -name '*.swift' -print0 | xargs -0 "$BREWUILINT"

      - name: Cache BrewLocalize build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Tools/BrewLocalize/.build
            .build/localize
          key: ${{ runner.os }}-brewlocalize-quality-${{ steps.swift-toolchain.outputs.fingerprint }}-${{ hashFiles('Tools/BrewLocalize/Package.swift', 'Tools/BrewLocalize/Sources/**', 'Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-brewlocalize-quality-${{ steps.swift-toolchain.outputs.fingerprint }}-

      # Catalogs must match the code so translators see every string. This builds the package once
      # (cached above) to get the compiler's own string extraction.
      - name: Check string catalogs are in sync
        run: scripts/localize sync --check

      - name: Verify string catalogs
        run: scripts/localize verify

      # The quiet maintainer signal: what still needs translating, in the job summary, never a failure.
      - name: Localization status
        run: scripts/localize status --markdown >> "$GITHUB_STEP_SUMMARY"

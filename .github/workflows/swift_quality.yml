name: Swift Quality

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "**/*.swift"
      - ".swiftlint*"
      - ".swiftformat"
      - "Brewfile"
      - "scripts/pre-commit"

permissions:
  contents: read

jobs:
  swift-quality:
    name: SwiftFormat + SwiftLint
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install swiftformat swiftlint

      - name: Check formatting
        run: swiftformat --lint .

      - name: Run SwiftLint (strict)
        run: swiftlint lint --strict

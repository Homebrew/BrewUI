name: Release

on:
  # Manual trigger used to promote the most recent main build to a release.
  workflow_dispatch:
  # A no-side-effect dry run whenever this workflow file itself changes.
  push:
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write # create the release (and its tag)
  actions: read # download the build artifact from the Build workflow
  pull-requests: write # open the version bump PR

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # Don't persist the token in .git/config (zizmor: artipacked); nothing
          # here pushes (gh creates the tag as part of the release).
          persist-credentials: false

      # Download the candidate build and read the version it was stamped with:
      # the app bundle itself names the tag, so nothing is read from a checked-in
      # file. Capture the run's headSha so the tag lands on the exact commit the
      # bytes were built from — main has usually moved on since the candidate
      # built, and tagging current HEAD would point the tag at code that is not
      # in the shipped artifacts.
      - name: Download candidate build and resolve version
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r RUN_ID HEADSHA < <(gh run list --workflow=build.yml \
            --branch=main --status=success --limit 1 \
            --json databaseId,headSha \
            --jq 'if length == 0 then "" else "\(.[0].databaseId) \(.[0].headSha)" end')
          if [ -z "$RUN_ID" ] || [ -z "$HEADSHA" ]; then
            echo "No successful Build workflow run found. Run Build first."
            exit 1
          fi
          echo "Promoting build run $RUN_ID (commit $HEADSHA)"
          # The .pkg is the website download; the .zip is the bare app for casks.
          gh run download "$RUN_ID" --name Homebrew-pkg --dir dist
          gh run download "$RUN_ID" --name Homebrew-app --dir dist
          shopt -s nullglob
          pkgs=(dist/Homebrew-*.pkg)
          zips=(dist/Homebrew-*.zip)
          if [ ${#pkgs[@]} -eq 0 ] || [ ${#zips[@]} -eq 0 ]; then
            echo "Downloaded artifacts are missing a Homebrew-*.pkg or Homebrew-*.zip."
            exit 1
          fi
          # Read the marketing version authoritatively from the app bundle (the
          # zip was made with `ditto -c -k --keepParent`, so extract with ditto).
          ditto -x -k "${zips[0]}" dist/app
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            dist/app/Homebrew.app/Contents/Info.plist)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected version '$VERSION' read from the app bundle."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "HEADSHA=$HEADSHA" >> "$GITHUB_ENV"
          echo "PKG_PATH=${pkgs[0]}" >> "$GITHUB_ENV"
          echo "APP_ZIP=${zips[0]}" >> "$GITHUB_ENV"

      # Cross-check the .pkg filename carries the same version as the app bundle,
      # guarding against a mismatched artifact pairing.
      - name: Verify pkg matches app version
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "$PKG_PATH" in
            *"$VERSION"*) echo "pkg $PKG_PATH matches version $VERSION" ;;
            *) echo "pkg $PKG_PATH does not match app version $VERSION"; exit 1 ;;
          esac

      # Immutable-tag safety: never overwrite an existing tag. If this version was
      # already released, the released commit has not been superseded yet.
      - name: Ensure tag does not already exist
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin. Nothing to release."
            exit 1
          fi

      # On the push dry run, exercise permissions without creating anything and
      # without needing an artifact (so it passes before any main build exists).
      - name: Dry run
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Dry run — verifying permissions without side effects."
          gh release list
          git ls-remote --tags origin | head

      # Create the tag together with the Release, on the candidate's commit
      # (--target), so a failed release leaves no dangling tag and the tag points
      # at the exact bytes shipped.
      - name: Create release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$PKG_PATH" "$APP_ZIP" \
            --target "$GITHUB_SHA" --generate-notes


name: Release

on:
  # Manual trigger. `action` selects the release kind:
  #   promote-minor — the routine case: promote the latest main build as-is.
  #   cut-major     — deliberate X.0.0: tag main HEAD, build it fresh, publish.
  #   cut-hotfix    — patch a shipped line: dispatch from a release/* branch.
  workflow_dispatch:
    inputs:
      action:
        description: Release kind. cut-hotfix must be dispatched from a release/* branch.
        type: choice
        options:
          - promote-minor
          - cut-major
          - cut-hotfix
        default: promote-minor
  # A no-side-effect dry run whenever this workflow file itself changes.
  push:
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write # create the release (and its tag)
  actions: read # download the build artifact from the Build workflow
  id-token: write # cut-major's reusable build attests; capped by the caller
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # promote-minor: the routine, automatic case. Promote the most recent main
  # build as-is (no rebuild, no version maths); the version comes from the built
  # app itself. Also serves the push dry run.
  promote-minor:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'promote-minor')
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # Don't persist the token in .git/config (zizmor: artipacked); nothing
          # here pushes (gh creates the tag as part of the release).
          persist-credentials: false

      # Download the candidate build and read the version it was stamped with:
      # the app bundle itself names the tag, so nothing is read from a checked-in
      # file. Capture the run's headSha so the tag lands on the exact commit the
      # bytes were built from — main has usually moved on since the candidate
      # built, and tagging current HEAD would point the tag at code that is not
      # in the shipped artifacts.
      - name: Download candidate build and resolve version
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r RUN_ID HEADSHA < <(gh run list --workflow=build.yml \
            --branch=main --status=success --limit 1 \
            --json databaseId,headSha \
            --jq 'if length == 0 then "" else "\(.[0].databaseId) \(.[0].headSha)" end')
          if [ -z "$RUN_ID" ] || [ -z "$HEADSHA" ]; then
            echo "No successful Build workflow run found. Run Build first."
            exit 1
          fi
          echo "Promoting build run $RUN_ID (commit $HEADSHA)"
          # The .pkg is the website download; the .zip is the bare app for casks.
          gh run download "$RUN_ID" --name Homebrew-pkg --dir dist
          gh run download "$RUN_ID" --name Homebrew-app --dir dist
          shopt -s nullglob
          pkgs=(dist/Homebrew-*.pkg)
          zips=(dist/Homebrew-*.zip)
          if [ ${#pkgs[@]} -eq 0 ] || [ ${#zips[@]} -eq 0 ]; then
            echo "Downloaded artifacts are missing a Homebrew-*.pkg or Homebrew-*.zip."
            exit 1
          fi
          # Read the marketing version authoritatively from the app bundle (the
          # zip was made with `ditto -c -k --keepParent`, so extract with ditto).
          ditto -x -k "${zips[0]}" dist/app
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            dist/app/Homebrew.app/Contents/Info.plist)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected version '$VERSION' read from the app bundle."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "HEADSHA=$HEADSHA" >> "$GITHUB_ENV"
          echo "PKG_PATH=${pkgs[0]}" >> "$GITHUB_ENV"
          echo "APP_ZIP=${zips[0]}" >> "$GITHUB_ENV"

      # Cross-check the .pkg filename carries the same version as the app bundle,
      # guarding against a mismatched artifact pairing.
      - name: Verify pkg matches app version
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "$PKG_PATH" in
            *"$VERSION"*) echo "pkg $PKG_PATH matches version $VERSION" ;;
            *) echo "pkg $PKG_PATH does not match app version $VERSION"; exit 1 ;;
          esac

      # Immutable-tag safety: never overwrite an existing tag. If this version was
      # already released, the released commit has not been superseded yet.
      - name: Ensure tag does not already exist
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin. Nothing to release."
            exit 1
          fi

      # On the push dry run, exercise permissions without creating anything and
      # without needing an artifact (so it passes before any main build exists).
      - name: Dry run
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Dry run — verifying permissions without side effects."
          gh release list
          git ls-remote --tags origin | head

      # Create the tag together with the Release, on the candidate's commit
      # (--target), so a failed release leaves no dangling tag and the tag points
      # at the exact bytes shipped.
      - name: Create release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$PKG_PATH" "$APP_ZIP" \
            --target "$GITHUB_SHA" --generate-notes

  # cut-major: deliberate X.0.0. Compute the next major, tag main's HEAD, then
  # build that tagged commit fresh (distance 0 -> the build carries X.0.0) and
  # publish it. Freeze merges to main while running so HEAD is the intended
  # commit. The tag is pushed before the build, so a failed build can leave a
  # tag with no release — this is a deliberate, supervised action, unlike
  # promote-minor.
  major-tag:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'cut-major'
    runs-on: macos-26
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Compute next major and tag HEAD
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || echo v0.0.0)
          IFS=. read -r major _ _ <<< "${LAST#v}"
          VERSION="$((major + 1)).0.0"
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin."
            exit 1
          fi
          SHA=$(git rev-parse HEAD)
          git tag "$TAG" "$SHA"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tagged $TAG at $SHA"

  # Build the tagged commit fresh, notarised and uploaded, via the reusable
  # build workflow. secrets: inherit passes the signing/notary secrets; the
  # notarize input turns on the release-build steps for this non-push event.
  major-build:
    needs: major-tag
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.major-tag.outputs.tag }}
      notarize: true
    secrets: inherit

  major-release:
    needs: [major-tag, major-build]
    runs-on: macos-26
    steps:
      - name: Download built artifacts from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" --name Homebrew-pkg --dir dist
          gh run download "${{ github.run_id }}" --name Homebrew-app --dir dist
          shopt -s nullglob
          pkgs=(dist/Homebrew-*.pkg)
          zips=(dist/Homebrew-*.zip)
          if [ ${#pkgs[@]} -eq 0 ] || [ ${#zips[@]} -eq 0 ]; then
            echo "Built artifacts are missing a Homebrew-*.pkg or Homebrew-*.zip."
            exit 1
          fi
          echo "PKG_PATH=${pkgs[0]}" >> "$GITHUB_ENV"
          echo "APP_ZIP=${zips[0]}" >> "$GITHUB_ENV"

      # The tag already exists (pushed by major-tag), so gh releases onto it.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.major-tag.outputs.tag }}" "$PKG_PATH" "$APP_ZIP" \
            --generate-notes

      - name: Open Homebrew cask PR
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        run: |
          SHA=$(shasum -a 256 "$APP_ZIP" | cut -d' ' -f1)
          brew bump-cask-pr --version "${{ needs.major-tag.outputs.version }}" --sha256 "$SHA" homebrew-app

  # cut-hotfix: patch a shipped release. Dispatch this with the workflow ref set
  # to a release/* branch cut from the old tag; the nearest reachable tag on that
  # branch is that line's release (other lines' tags are unreachable), so patch+1
  # targets the right line. Same shape as cut-major (compute -> tag -> build
  # fresh -> release), but published with --latest=false so patching an old line
  # never steals "latest" from the newest major.
  hotfix-tag:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'cut-hotfix'
    runs-on: macos-26
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Guard release/* branch
        run: |
          if [[ "${{ github.ref_name }}" != release/* ]]; then
            echo "cut-hotfix must be dispatched from a release/* branch (got '${{ github.ref_name }}')."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Compute next patch and tag branch HEAD
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*')
          IFS=. read -r major minor patch <<< "${LAST#v}"
          VERSION="${major}.${minor}.$((patch + 1))"
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin."
            exit 1
          fi
          SHA=$(git rev-parse HEAD)
          git tag "$TAG" "$SHA"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tagged $TAG at $SHA (from $LAST)"

  hotfix-build:
    needs: hotfix-tag
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.hotfix-tag.outputs.tag }}
      notarize: true
    secrets: inherit

  hotfix-release:
    needs: [hotfix-tag, hotfix-build]
    runs-on: macos-26
    steps:
      - name: Download built artifacts from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" --name Homebrew-pkg --dir dist
          gh run download "${{ github.run_id }}" --name Homebrew-app --dir dist
          shopt -s nullglob
          pkgs=(dist/Homebrew-*.pkg)
          zips=(dist/Homebrew-*.zip)
          if [ ${#pkgs[@]} -eq 0 ] || [ ${#zips[@]} -eq 0 ]; then
            echo "Built artifacts are missing a Homebrew-*.pkg or Homebrew-*.zip."
            exit 1
          fi
          echo "PKG_PATH=${pkgs[0]}" >> "$GITHUB_ENV"
          echo "APP_ZIP=${zips[0]}" >> "$GITHUB_ENV"

      # --latest=false: patching an old line must not override the newest major.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.hotfix-tag.outputs.tag }}" "$PKG_PATH" "$APP_ZIP" \
            --latest=false --generate-notes

      - name: Open Homebrew cask PR
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        run: |
          SHA=$(shasum -a 256 "$APP_ZIP" | cut -d' ' -f1)
          brew bump-cask-pr --version "${{ needs.hotfix-tag.outputs.version }}" --sha256 "$SHA" homebrew-app

name: Live E2E Canaries

# Off the PR path: real Homebrew and real network, so it can go red for reasons
# that have nothing to do with the change under review. It also installs and
# uninstalls `hello`, which is safe here because the runner is ephemeral.
# See BrewUITests/E2E/README.md.
on:
  schedule:
    # 05:00 UTC nightly — after the tap's own nightly churn, well before the day starts.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Optional xcodebuild -only-testing filter for the live suite"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Serial by workflow, not by ref: two runs would fight over one machine's brew state.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Live end-to-end canaries
    # GitHub's macOS runners ship with Homebrew installed and have egress to
    # formulae.brew.sh and ghcr.io, which is what this suite requires.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job uploads artifacts on failure; a persisted token in .git/config could ride along.
          persist-credentials: false

      - name: Run live end-to-end canaries (Brew-E2E test plan)
        id: e2e
        # Through env rather than interpolated into the script body, so the input cannot inject shell.
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          set -o pipefail
          if [[ -n "${TEST_FILTER}" ]]; then
            scripts/test-e2e -only-testing:"${TEST_FILTER}" | tee xcodebuild-e2e.log
          else
            scripts/test-e2e | tee xcodebuild-e2e.log
          fi

      # Also on a green run that needed a retry: the result bundle holds the screenshot of the
      # attempt that failed, which is the only account of what the flake looked like.
      - name: Upload logs on failure
        if: failure() || cancelled() || steps.e2e.outputs.flaky == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: |
            xcodebuild-e2e.log
            E2ETestResults.xcresult
          retention-days: 7

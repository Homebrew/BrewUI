# SwiftFormat (see Mintfile / `.swiftformat`) owns mechanical layout and spacing.
# Disable SwiftLint rules that duplicate it — especially correctable ones, or
# `swiftlint --fix` after SwiftFormat will fight the formatter (e.g. trailing_comma).
disabled_rules:
  - closing_brace
  - colon
  - comma
  - empty_parentheses_with_trailing_closure
  - function_name_whitespace
  - leading_whitespace
  - opening_brace
  - redundant_void_return
  - return_arrow_whitespace
  - trailing_comma
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  # Allow explicit empty init/deinit declarations when used to carry isolation intent.
  - unneeded_synthesized_initializer
  - vertical_whitespace
  - void_return

included:
  - Brew
  - BrewTests
  - BrewUITests
  - Sources
  - Tests

excluded:
  - .build
  - docs
  - scripts

line_length:
  warning: 120
  error: 140
  ignores_comments: true

file_length:
  warning: 600
  error: 1000

identifier_name:
  min_length:
    warning: 1
  excluded:
    - id
    - i
    - j
    - x
    - y
    - z
